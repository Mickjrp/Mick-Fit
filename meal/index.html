<!DOCTYPE html>
<html lang="th" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1417" id="meta-theme">
<title>Mick Meal Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first single column, sticky kcal bar on top, tab bar at bottom, bottom sheets for editing */
:root{
  --bg:#0f1417; --surface:#161d21; --surface-2:#1d262b; --line:#2a353b;
  --text:#e8edef; --muted:#8b9aa1;
  --accent:#f2a33a; --accent-ink:#1d1305;
  --protein:#58c4ae; --carbs:#8ea6ff; --fat:#e889a6; --water:#4fb0ee;
  --good:#6cc38a; --warn:#f0c14b; --bad:#ef6b5b;
  --f-display:"Bricolage Grotesque","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
  color-scheme:dark;
}
:root[data-mode="light"]{
  --bg:#eef1f2; --surface:#ffffff; --surface-2:#f4f6f7; --line:#dbe1e4;
  --text:#14191c; --muted:#5d6b72;
  --accent:#c9740a; --accent-ink:#ffffff;
  --protein:#13897a; --carbs:#4a63d6; --fat:#c2416b; --water:#1f86c9;
  --good:#2f8f53; --warn:#a87a00; --bad:#c9392b;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
html,body{max-width:100%;overflow-x:clip}
/* safe areas (Dynamic Island, home indicator) are handled by the Mick Fit shell; iOS still passes them into this frame, so top/bottom insets are 0px here */
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body.locked{overflow:hidden}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:18px}
h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sm{font-size:13px}

.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:calc(0px + 10px) 16px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.kbar-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand{font:700 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kbar-num{font-size:13px;color:var(--muted)}
.kbar-num b{font:700 20px var(--f-display);color:var(--text);font-variant-numeric:tabular-nums}
.track{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.fill{height:100%;border-radius:99px;background:var(--accent);transition:width .4s ease}
.fill.over{background:var(--warn)}
.track.thin{height:6px;border:0}

main{flex:1;padding:16px 16px 32px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px}

.banner{margin:12px 16px 0;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));font-size:13px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);background:transparent;border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.icon-btn{border:0;background:transparent;width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center;color:var(--muted);font-size:20px;line-height:1}
.icon-btn:active{background:var(--surface-2)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1}

.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent);background:color-mix(in srgb,var(--good) 12%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.pill.accent{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
button.pill{cursor:pointer}

/* today */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav h1{font-size:22px}
.daynav .sub{font-size:13px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wday{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:12px;color:var(--muted);font-size:11px}
.wday[aria-current="date"]{background:var(--surface);color:var(--text);outline:1px solid var(--line)}
.ring{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;position:relative}
.ring::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg)}
.wday[aria-current="date"] .ring::after{background:var(--surface)}
.ring span{position:relative;z-index:1;font:700 12px var(--f-display);color:var(--text)}

.macros{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:center}
.big{font:700 40px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big small{font-size:14px;color:var(--muted);font-weight:500;letter-spacing:0}
.mrow{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:8px;font-size:12px}
.mrow .lbl{color:var(--muted)}
.mrow .val{font-variant-numeric:tabular-nums;font-family:var(--f-display);font-size:12px}
.macro-list{display:flex;flex-direction:column;gap:8px}

.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.check-item{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.check-item:first-child{border-top:0}
.cbox{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0;color:var(--accent-ink)}
.cbox svg{width:16px;height:16px;opacity:0}
.cbox[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.cbox[aria-pressed="true"] svg{opacity:1}
.ci-main{min-width:0;border:0;background:transparent;text-align:left;padding:0}
.ci-slot{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.ci-name{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.check-item.done .ci-name{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.ci-kcal{text-align:right;font-size:12px;color:var(--muted);line-height:1.3}
.ci-kcal b{display:block;color:var(--text);font:700 14px var(--f-display);font-variant-numeric:tabular-nums}

/* water */
.water-card{background:linear-gradient(160deg,color-mix(in srgb,var(--water) 14%,var(--surface)),var(--surface) 70%)}
.water-body{display:grid;grid-template-columns:86px 1fr;gap:18px;align-items:center}
.bottle{width:86px;height:150px;border-radius:26px 26px 22px 22px;border:2px solid color-mix(in srgb,var(--water) 55%,var(--line));position:relative;overflow:hidden;background:var(--surface-2)}
.bottle::before{content:"";position:absolute;top:-2px;left:26px;right:26px;height:10px;background:color-mix(in srgb,var(--water) 55%,var(--line));border-radius:0 0 6px 6px;z-index:2}
.bottle .wfill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(180deg,color-mix(in srgb,var(--water) 85%,white),var(--water));transition:height .5s ease}
.bottle .wfill::before{content:"";position:absolute;top:-6px;left:-10%;width:120%;height:12px;border-radius:50%;background:color-mix(in srgb,var(--water) 85%,white)}
.bottle .marks{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-evenly;z-index:1;pointer-events:none}
.bottle .marks i{display:block;height:1px;width:18px;margin-left:auto;background:color-mix(in srgb,var(--text) 22%,transparent)}
.wnum{font:700 32px/1 var(--f-display);font-variant-numeric:tabular-nums}
.wnum small{font-size:14px;color:var(--muted);font-weight:500}
.wbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.wbtn{border:1px solid color-mix(in srgb,var(--water) 40%,var(--line));background:color-mix(in srgb,var(--water) 10%,transparent);color:var(--text);border-radius:12px;min-height:44px;font-weight:600}
.wcustom{display:flex;gap:8px;margin-top:8px}
.wcustom input{flex:1;min-width:0}

/* lists */
.search{width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;text-align:left;width:100%}
.item .t{font-weight:600}
.item .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.item .kc{text-align:right;font:700 18px var(--f-display);font-variant-numeric:tabular-nums}
.item .kc small{display:block;font:500 11px var(--f-body);color:var(--muted)}
.mtag{font-variant-numeric:tabular-nums}
.mtag.p{color:var(--protein)} .mtag.c{color:var(--carbs)} .mtag.f{color:var(--fat)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;gap:12px;align-items:center}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--text);box-shadow:0 1px 0 var(--line)}

.stock-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.stock-row:first-child{border-top:0}
.stock-row .nm{border:0;background:transparent;text-align:left;padding:0;font-weight:500}
.stock-row .sub{font-size:12px;color:var(--muted);grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.shop-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.shop-row:first-child{border-top:0}
.cat-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.stat b{font:700 18px var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}

/* forms */
input[type=text],input[type=number],input[type=url],input[type=date],input[type=search],select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px;font-size:16px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>span,.mini>span{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid4 input{padding:10px 8px}
.form{display:flex;flex-direction:column;gap:12px}
.rows{display:flex;flex-direction:column;gap:8px}
.row-ed{display:grid;grid-template-columns:repeat(6,1fr) 32px;gap:6px;align-items:end;padding:10px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--surface-2) 50%,transparent)}
.row-ed .mini{display:flex;flex-direction:column;gap:2px;min-width:0}
.row-ed .mini input{padding:8px;min-height:38px;font-size:15px}
.w6{grid-column:span 6}.w4{grid-column:span 4}.w3{grid-column:span 3}.w2{grid-column:span 2}.w1{grid-column:span 1}
.row-ed .del{grid-column:7;grid-row:1;align-self:start}
.divider{height:1px;background:var(--line);margin:4px 0}
.hint{font-size:12px;color:var(--muted)}

/* detail */
.d-macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.d-macros div{background:var(--surface-2);border-radius:12px;padding:10px 8px;text-align:center}
.d-macros b{display:block;font:700 18px var(--f-display);font-variant-numeric:tabular-nums}
.d-macros span{font-size:11px;color:var(--muted)}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.ing li .num{white-space:nowrap}
.ing li:first-child{border-top:0}
.steps{white-space:pre-wrap;margin:0}
.source{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.source .bk{width:34px;height:44px;border-radius:4px 8px 8px 4px;background:var(--accent);flex:none;box-shadow:inset 4px 0 0 color-mix(in srgb,black 25%,transparent)}
.link-out{font-size:13px;overflow-wrap:anywhere}

/* sheet */
#sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
#sheet-wrap[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgb(0 0 0 / .55);border:0;padding:0}
#sheet{position:relative;width:100%;max-width:560px;max-height:92%;background:var(--surface);border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:0;display:flex;flex-direction:column;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
#sheet>header{display:flex;justify-content:space-between;align-items:center;padding:14px 12px 10px 18px;border-bottom:1px solid var(--line)}
#sheet-body{overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
#sheet-foot{padding:12px 18px calc(12px + 0px);border-top:1px solid var(--line);display:flex;gap:8px}
#sheet-foot:empty{display:none}
#sheet-foot .btn{flex:1}

#confirm{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:rgb(0 0 0 / .55)}
#confirm[hidden]{display:none}
#confirm .box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:340px;width:100%;display:flex;flex-direction:column;gap:14px}

#viewer{position:fixed;inset:0;z-index:80;background:#000;overflow:auto;-webkit-overflow-scrolling:touch;padding:calc(0px + 52px) 0 calc(0px + 16px)}
#viewer[hidden]{display:none}
#viewer img{display:block;width:100%;max-width:900px;margin:0 auto}
.viewer-x{position:fixed;top:calc(0px + 8px);right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgb(255 255 255 / .16);color:#fff;font-size:24px;z-index:81}
.item.has-img{grid-template-columns:72px 1fr auto;padding:10px;gap:4px 12px}
.item.has-img .meta{margin-top:2px}
.thumb{width:72px;height:72px;border-radius:10px;object-fit:cover;grid-row:span 1;background:var(--surface-2);display:block}
.thumb.ph{background:repeating-linear-gradient(135deg,var(--surface-2) 0 8px,var(--line) 8px 9px)}
.hero{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:14px;display:block;background:var(--surface-2)}
.desc{margin:0;color:var(--muted);font-style:italic}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px;white-space:normal}
ol.steps li::marker{color:var(--accent);font-family:var(--f-display);font-weight:700}
.img-ed{display:flex;flex-direction:column;gap:8px}
.img-ed img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px}
.img-ed .ph{display:grid;place-items:center;aspect-ratio:16/10;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13px}
.seg.seg3{grid-template-columns:1fr 1fr 1fr}
.seg.seg3 button{font-size:13px;padding:8px 4px}
.sortbar{display:flex;align-items:center;gap:10px}
.sortbar .seg{flex:1}
.sortbar .seg button{font-size:12px;padding:6px}
.ing li .nm{flex:1}
.mk{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 11px var(--f-display);border:1px solid var(--line);color:var(--muted);margin-top:2px}
.mk.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.mk.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.mk.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.cov{border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.cov-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cov .btn{align-self:flex-start}
.btn.fav-on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.star{color:var(--accent)}
.cook-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.cook-row:first-child{border-top:0}
.cook-main{flex:1;min-width:0;display:flex;gap:10px;align-items:center;border:0;background:transparent;padding:0;text-align:left}
.cook-main .t{display:block;font-weight:600;line-height:1.3}
.cook-main .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px}
.cook-main .miss{display:block;font-size:12px;color:var(--bad);margin-top:3px}
.cook-main .miss.ok{color:var(--good)}
.thumb.sm{width:54px;height:54px;border-radius:9px;flex:none}
.stk{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.stk.short,.stk.low{color:var(--warn)}.stk.out,.stk.miss{color:var(--bad)}
.nowrap{white-space:nowrap}
.buy{color:var(--accent);font-weight:600}
.portion{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;font-size:14px}
.portion .icon-btn{border:1px solid var(--line);width:34px;height:34px}
.portion b{min-width:24px;text-align:center;font-size:18px}
.wbtn small{font-weight:500;color:var(--muted);font-size:11px}
.box-tag{color:var(--protein);font-weight:600}
.quick{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.chip.box{border-color:color-mix(in srgb,var(--protein) 50%,var(--line));color:var(--text)}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.wk{gap:8px;padding:12px 14px}
.wk.is-today{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.wk.is-past{opacity:.6}
.wk-date{border:0;background:none;padding:0;text-align:left;font-size:15px}
.wk-list{display:flex;flex-direction:column;gap:2px}
.wk-e{border:0;background:none;padding:6px 0;text-align:left;font-size:14px;border-top:1px dashed var(--line);display:block;width:100%}
.wk-e:first-child{border-top:0}
.wk-e.done{color:var(--muted);text-decoration:line-through}
.wk-e .muted{font-size:12px;margin-right:4px}
.wt-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.wt-in{display:flex;gap:6px;width:150px}
.wt-in input{min-width:0}
.spark{width:100%;height:64px;display:block}
.days7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days7 .chip{padding:6px 0;text-align:center}
.danger-zone summary{cursor:pointer;color:var(--bad);font-size:13px;font-weight:600}
.danger-zone[open]{display:flex;flex-direction:column;gap:8px}
details.done-list summary{cursor:pointer;list-style:none}
.onboard{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.onboard .pill{margin-left:6px}
#toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:70;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + 0px);display:flex;justify-content:center}
nav.tabs .inner{width:100%;max-width:560px;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font:500 11px var(--f-body);padding:6px 0;border-radius:12px;position:relative}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .badge{position:absolute;top:2px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:99px;background:var(--bad);color:#fff;font:700 10px/17px var(--f-display);padding:0 4px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.skel{height:84px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface),var(--surface-2),var(--surface));background-size:200% 100%;animation:sh 1.2s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.macros{grid-template-columns:1fr}.big{font-size:34px}}
</style>

    if (got.size >= 6) UI.loaded = true;
    if (!sheet) render(); else renderTop();
  };
  const fail = e => { clearTimeout(timer); $('#banner').innerHTML = '<div class="banner">โหลดข้อมูลไม่สำเร็จ ลองปิดแล้วเปิดหน้านี้ใหม่</div>'; UI.loaded = true; render(); };
  const sub = (key, apply) => db.collection('app').doc(key).onSnapshot(snap => {
    if (!store.pending[key]) apply(snap.exists ? snap.data() : null);
    done(key, snap);
  }, fail);
  sub('settings', d => { S.settings = { ...clone(DEFAULT_SETTINGS), ...(d ? clone(d) : {}) }; applyTheme(); });
  db.collection('recipes').onSnapshot(snap => {
    snap.docs.forEach(doc => { if (!store.pending['recipe:' + doc.id]) S.over[doc.id] = clone(doc.data()); });
    rebuildRecipes(); done('recipes', snap);
  }, fail);
  sub('preps', d => { S.preps = d && d.items ? clone(d.items) : []; });
  sub('pantry', d => { S.pantry = d && d.items ? clone(d.items) : []; });
  sub('body', d => { S.body = d && d.weights ? clone(d) : { weights: [] }; });
  db.collection('days').orderBy('date', 'desc').limit(90).onSnapshot(snap => {
    snap.docs.forEach(doc => { if (!store.pending['day:' + doc.id]) S.days[doc.id] = clone(doc.data()); });
    done('days', snap);
  }, fail);
}

}
function weekIngredients(ws) {
  const list = [], uses = new Map(), today = todayKey();
  for (let o = 0; o < 7; o++) {
    const k = addDays(ws, o); if (k < today) continue;
    getDay(k).entries.forEach(e => {
      if (e.done || e.prepId || !e.recipeId) return;
      const r = recipe(e.recipeId); if (!r) return;
      const f = (num(e.servings) || 1) / servingsOf(r);
      uses.set(r.id, (uses.get(r.id) || 0) + (num(e.servings) || 1));
      (r.ingredients || []).forEach(i => list.push({ name: i.name, qty: scaleQty(i.qty, f), unit: i.unit }));
    });
  }
  return { list: mergeIngs(list), uses };
}
function mergeIngs(list) {
  const out = new Map();
  list.forEach(i => {
    const info = ingInfo(i), key = info.t.join(' ') || i.name, b = toBase(i.qty, i.unit), cur = out.get(key);
    if (cur && cur.b && b && cur.b.d === b.d) { cur.b.v += b.v; return; }
    if (cur && !cur.b && !b) return;
    out.set(cur ? key + '#' + out.size : key, { name: info.label || i.name, b: b ? { ...b } : null, qty: i.qty, unit: i.unit });
  });
  return [...out.values()].map(x => x.b ? { name: x.name, qty: +x.b.v.toFixed(1), unit: x.b.d === 'm' ? 'g' : x.b.d === 'v' ? 'ml' : '' } : { name: x.name, qty: x.qty, unit: x.unit });
}
function viewWeek() {

  const sums = days.map(k => { const d = getDay(k); return { k, d, plan: d.entries.reduce((a, e) => { const m = macrosOf(e); a.kcal += m.kcal; a.protein += m.protein; return a; }, { kcal: 0, protein: 0 }), tg: targetsFor(k) }; });
  const avgK = sums.reduce((a, x) => a + x.plan.kcal, 0) / 7, avgT = sums.reduce((a, x) => a + x.tg.kcal, 0) / 7, avgP = sums.reduce((a, x) => a + x.plan.protein, 0) / 7;
  const { list, uses } = weekIngredients(ws);
  const cv = list.length ? coverage({}, 1, list) : null;
  const label = `${kdate(ws).getDate()} ${thDate(ws, { month: 'short' })} – ${thDate(addDays(ws, 6), { day: 'numeric', month: 'short' })}`;
  return `
  <section class="daynav">
    <button class="icon-btn" data-act="week-shift" data-n="-7" aria-label="สัปดาห์ก่อน">‹</button>
    <div style="text-align:center"><h1 style="font-size:20px">${esc(label)}</h1><div class="sub">${ws === weekStart(today) ? 'สัปดาห์นี้' : `<button class="pill" data-act="week-shift" data-n="0">กลับสัปดาห์นี้</button>`}</div></div>
    <button class="icon-btn" data-act="week-shift" data-n="7" aria-label="สัปดาห์ถัดไป">›</button>
  </section>
  <section class="stat-grid">
    <div class="stat"><b>${fmt(avgK)}</b><span>kcal/วัน ตามแผน</span></div>
    <div class="stat"><b>${fmt(avgT)}</b><span>เป้าเฉลี่ย kcal/วัน</span></div>
    <div class="stat"><b>${fmt(avgP)}g</b><span>protein/วัน</span></div>
  </section>
  ${avgK < avgT * 0.9 ? `<div class="banner" style="margin:0">แผนเฉลี่ยต่ำกว่าเป้าวันละ ${fmt(avgT - avgK)} kcal ลองเพิ่มมื้อ ของกินด่วน หรือเพิ่ม serving ในมื้อเริ่มต้นที่ตั้งค่า</div>` : ''}
  <section class="card">
    <div class="card-head"><h2>ของที่ต้องใช้ทั้งสัปดาห์</h2>${cv ? covPill(cv) : ''}</div>
    ${cv ? `<p class="hint" style="margin:0">รวมวัตถุดิบของทุกมื้อที่ยังไม่กิน ตั้งแต่วันนี้ถึงสิ้นสัปดาห์ (${[...uses.values()].reduce((a, b) => a + b, 0)} servings จาก ${uses.size} เมนู) ไม่นับมื้อที่กินจากกล่อง Prep</p>
      ${gap(cv) ? `<div class="sm"><span class="muted">ต้องซื้อ:</span> ${lackText(cv)}</div><button class="btn primary sm" data-act="week-shop">+ ส่ง ${gap(cv)} อย่างไปรายการซื้อ</button>` : '<div class="sm" style="color:var(--good)">ของในคลังพอสำหรับแผนทั้งสัปดาห์</div>'}`
      : '<p class="hint" style="margin:0">ยังไม่มีมื้อที่ใช้เมนูจาก cookbook ในช่วงที่เหลือของสัปดาห์</p>'}
  </section>
  ${sums.map(({ k, d, plan, tg }) => { const p = Math.min(100, plan.kcal / (tg.kcal || 1) * 100), past = k < today; return `
  <section class="card wk ${k === today ? 'is-today' : ''} ${past ? 'is-past' : ''}">

function stockNote(x) {

  if (x.st === 'short') return `คลังมี ${s} · ต้องใช้ ${fromBase(x.total.v, x.total.d)}${x.approx ? ' (ประมาณ)' : ''}`;

}
function ingList(ings, cv, factor = 1) {

  (ings || []).forEach(i => {
    if ((i.group || '') !== g) { if (g !== null || i.group) h += `</ul>${i.group ? `<div class="cat-h">${esc(i.group)}</div>` : ''}<ul class="ing">`; g = i.group || ''; }
    const x = row.get(i), m = cv && x && MARK[x.st], note = cv && x && x.st !== 'basic' && x.st !== 'opt' ? stockNote(x) : '';
    h += `<li>${m ? `<span class="mk ${m[1]}" title="${m[2]}" aria-label="${m[2]}">${m[0]}</span>` : ''}<span class="nm">${esc(i.name)}${note ? `<span class="stk ${x.st}">${note}</span>` : ''}</span><span class="num muted">${esc(scaleQty(i.qty, factor) ?? '')} ${esc(i.unit || '')}</span></li>`;

}

function resizeImage(file, max = 1000) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('resize')), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('load')); };
    img.src = url;
  });
}

function boxAdjust(pid, n) {
  const p = prep(pid); if (!p) return;
  p.boxesLeft = Math.max(0, Math.min(num(p.meals), num(p.boxesLeft) + n));
  save('preps');
}

function finishPrep() {
  const d = sheet.draft;
  d.ingredients = (d.ingredients || []).filter(i => String(i.name || '').trim());

function prepToShop(d) {
  const ings = (d.ingredients || []).filter(i => String(i.name || '').trim());
  const n = addMissingToShop({}, 1, ings);
  ings.forEach(i => { const p = findPantry(i); if (p && p.toBuy) { if (!p.price && i.price) p.price = num(i.price); if (!p.store && i.store) p.store = i.store; if (!p.url && i.url) p.url = i.url; } });
  if (n) save('pantry');
  toast(n ? `เพิ่ม ${n} รายการลงรายการซื้อ` : 'ของในคลังพอแล้ว หรืออยู่ในรายการซื้อแล้ว');

function prepStock(d) {
  const ings = (d.ingredients || []).filter(i => String(i.name || '').trim());
  if (!ings.length) return '';
  const cv = coverage({}, 1, ings);
  if (!cv.need) return '';
  return `<div class="cov"><div class="cov-head"><b>${cv.ok ? 'ของในคลังพอสำหรับ Prep นี้' : `ในคลังมีพอ ${cv.have} จาก ${cv.need} อย่าง`}</b>${covPill(cv)}</div>
    ${gap(cv) ? `<div class="sm"><span class="muted">ต้องซื้อ:</span> ${lackText(cv)}</div>` : ''}</div>`;
}

  if (!ks.length) return 'ใส่ชื่อภาษาอังกฤษตามที่สูตรใช้ เพื่อให้แอปจับคู่กับเมนูได้';
  const n = S.recipes.filter(r => (r.ingredients || []).some(i => { const it = ingInfo(i).t; return keysOf(d).some(kt => kmatch(kt, it)); })).length;
  return `จับคู่ด้วย: ${esc([...new Set(ks)].join(', '))} · ใช้ใน ${n} เมนู`;
}

function doImport() {
  let d; try { d = JSON.parse($('#import-box').value); } catch (e) { toast('JSON ไม่ถูกต้อง'); return; }
  if (!d || typeof d !== 'object') { toast('JSON ไม่ถูกต้อง'); return; }
  if (d.settings) { S.settings = { ...clone(DEFAULT_SETTINGS), ...d.settings }; save('settings'); applyTheme(); }
  if (Array.isArray(d.recipes)) { d.recipes.forEach(r => { if (r && r.id) { S.over[r.id] = r; save('recipe:' + r.id); } }); rebuildRecipes(); }
  if (Array.isArray(d.preps)) { S.preps = d.preps; save('preps'); }
  if (Array.isArray(d.pantry)) { S.pantry = d.pantry; save('pantry'); }
  if (d.body && Array.isArray(d.body.weights)) { S.body = d.body; save('body'); }
  if (d.days && typeof d.days === 'object') Object.entries(d.days).forEach(([k, v]) => { S.days[k] = v; save('day:' + k); });
  closeSheet(); toast('นำเข้าข้อมูลแล้ว');
}

  cooked: el => { const r = recipe(el.dataset.id); if (!r || !sheet) return; const f = sheet.draft.portions / servingsOf(r); ask(`หักวัตถุดิบสำหรับ ${sheet.draft.portions} servings ออกจากคลัง?`, () => { const n = deductStock(r, f); toast(n ? `หักของออกจากคลังแล้ว ${n} รายการ` : 'ไม่มีของที่เทียบปริมาณได้ให้หัก'); if (sheet) drawSheet(); }, 'หักของ'); },
  'prep-deduct': () => ask('ทำ Prep นี้เสร็จแล้ว หักวัตถุดิบออกจากคลัง?', () => { const n = deductStock({}, 1, sheet.draft.ingredients); finishPrep(); toast(`เก็บกล่องเข้าตู้เย็นแล้ว หักของ ${n} รายการ`); }, 'หักของ'),
  'prep-cooked': () => { finishPrep(); toast('เก็บกล่องเข้าตู้เย็นแล้ว'); },
  'slot-add': () => { (S.settings.slots = S.settings.slots || []).push({ id: uid(), name: 'มื้อใหม่', recipeId: '' }); save('settings'); render(); },
  'slot-del': el => { S.settings.slots.splice(+el.dataset.i, 1); save('settings'); render(); },
  theme: el => { S.settings.theme = el.dataset.v; applyTheme(); save('settings'); render(); },
  export: () => openExport(),
  import: () => openImport(),
  'do-import': () => doImport(),
  'copy-export': async () => { try { await navigator.clipboard.writeText($('#export-box').value); toast('คัดลอกแล้ว'); } catch (e) { $('#export-box').select(); toast('กดค้างที่ข้อความเพื่อคัดลอก'); } },
  'load-sample': () => ask('แทนที่ข้อมูลปัจจุบันด้วยข้อมูลตัวอย่าง?', () => { applyAll(SAMPLE()); saveAll(); render(); toast('โหลดข้อมูลตัวอย่างแล้ว'); }, 'โหลด'),
  wipe: () => { try { localStorage.setItem(LS_KEY + '-backup', JSON.stringify({ settings: S.settings, over: S.over, preps: S.preps, pantry: S.pantry, days: S.days, body: S.body })); } catch (e) {} A.wipe2(); },
  wipe2: () => ask('ล้างเมนูที่แก้ไข/เพิ่มเอง Prep คลัง และประวัติทั้งหมด? สูตรจาก cookbook ยังอยู่ ย้อนกลับไม่ได้', () => {
    const keys = Object.keys(S.days);
    Object.keys(S.over).forEach(id => { if (store.db) store.db.collection('recipes').doc(id).delete().catch(() => {}); });
    S.over = {}; rebuildRecipes(); S.preps = []; S.pantry = []; ['preps', 'pantry'].forEach(save);
    keys.forEach(k => { delete S.days[k]; if (store.db) store.db.collection('days').doc(k).delete().catch(() => {}); });
    if (!store.db) saveLocal(); render(); toast('ล้างข้อมูลแล้ว');
  }, 'ล้าง'),
  'sheet-close': () => closeSheet(),
  'sheet-save': () => { if (sheet.onSave(sheet.draft) === false) return; closeSheet(); },
  'confirm-yes': () => { $('#confirm').hidden = true; const f = confirmFn; confirmFn = null; f && f(); },
  'confirm-no': () => { $('#confirm').hidden = true; confirmFn = null; }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || el.disabled) return; const f = A[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); } });
document.addEventListener('input', e => {
  const t = e.target;
  if (sheet && t.dataset.bind) {
    const v = t.type === 'checkbox' ? t.checked : t.dataset.type === 'num' ? (t.value === '' ? '' : num(t.value)) : t.value;
    setPath(sheet.draft, t.dataset.bind, v);
    if (t.dataset.redraw) drawSheet();
    if (sheet.onInput) sheet.onInput(sheet.draft, t.dataset.bind);
    return;
  }
  if (t.dataset.cfg) {
    const v = t.dataset.type === 'num' ? num(t.value) : t.value;
    setPath(S.settings, t.dataset.cfg, v); save('settings'); renderTop(); return;
  }
  if (t.dataset.input === 'search') { UI.q = t.value; $('#recipe-list').innerHTML = recipeList(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'img-file' && e.target.files[0]) { uploadRecipeImage(e.target.files[0]); return; }
  if (e.target.id === 'import-file' && e.target.files[0]) { const r = new FileReader(); r.onload = () => { $('#import-box').value = r.result; }; r.readAsText(e.target.files[0]); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('#viewer').hidden) A['viewer-close'](); else if (!$('#confirm').hidden) A['confirm-no'](); else if (sheet) closeSheet(); } if (e.key === 'Enter' && e.target.id === 'weight-kg') A['weight-save'](); });
const fromHash = () => { let h = location.hash.slice(1); if (h === 'prep') { h = 'plan'; UI.planSeg = 'prep'; } if (TABS.some(t => t[0] === h)) UI.tab = h; };
window.addEventListener('hashchange', () => { fromHash(); if (!sheet) render(); });
// Training screens change the program (train/rest days) and body weight; "storage" fires here when they do.
window.addEventListener('storage', e => {
  if (e.key === PROG_KEY) progRest = undefined;
  if ((e.key === PROG_KEY || e.key === BW_KEY) && UI.loaded && !sheet) render();
});
fromHash();
boot();
</script>
</body>
</html>
